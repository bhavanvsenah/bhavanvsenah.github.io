name: Check published catalog discovery

on: [push, pull_request]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published catalog matches the JSON catalogs
        run: python3 -B tools/catalog_discovery.py --check
      - name: Test catalog snapshot generation
        run: python3 -B -m unittest discover -s tools -p 'test_catalog_discovery.py'
